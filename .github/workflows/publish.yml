name: Publish to npm

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: read

  # npm provenance: links the published package to this workflow run
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm test

      # with a granular access token (publish, bypassing 2FA) as repository secret NPM_TOKEN
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
